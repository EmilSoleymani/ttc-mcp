# Tag-triggered dual publish: v* -> npm (`ttc-mcp`) + ghcr
# (`ghcr.io/emilsoleymani/ttc-mcp`) (stack-baseline: inherits go-planner's
# docker-deployment "ghcr+npm tag-triggered publish" spec).
#
# npm publish uses OIDC trusted publishing (no NPM_TOKEN secret): the package's
# trusted-publisher config on npmjs.com authorizes this repo + workflow, and the
# `id-token: write` permission below lets npm mint a short-lived credential.
# Requires npm >= 11.5.1 (Node 22 ships npm 10.x, so we upgrade npm first) and a
# one-time manual `npm publish --access public` to create the package before the
# trusted publisher can be configured. ghcr publish uses the built-in GITHUB_TOKEN.
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/emilsoleymani/ttc-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
