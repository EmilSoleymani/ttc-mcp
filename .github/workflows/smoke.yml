# Weekly smoke check: one schema-validated call per upstream domain (the
# static GTFS feed via CKAN, and the GTFS-Realtime feed) — catches TTC
# changing a feed's shape or endpoint outside of a refresh cycle. Files a
# GitHub issue on failure (stack-baseline: inherits go-planner's
# cicd-pipeline "weekly smoke cron with auto-issue" spec).
name: Smoke

on:
  schedule:
    - cron: "0 12 * * 1" # weekly, Monday 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run smoke checks
        run: npm run smoke

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_count=$(gh issue list --repo "$GITHUB_REPOSITORY" --label bug --state open --search "Smoke check failed in:title" --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "An open smoke-failure issue already exists — not filing a duplicate."
            exit 0
          fi
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Smoke check failed ($(date -u +%Y-%m-%d))" \
            --label bug \
            --body "The weekly smoke workflow failed — an upstream feed may be unreachable or have changed shape. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
