# PR checks (stack-baseline: inherits go-planner's cicd-pipeline spec §1).
#
# KEYLESS BY DESIGN: no secret is available to or needed by this workflow.
# The TTC feeds are keyless and unit tests run offline. The only secret-bearing
# workflows are the GTFS-refresh + smoke jobs added in the delivery slice.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --coverage
